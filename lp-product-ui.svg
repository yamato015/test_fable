  <text x="68" y="436" fill="#5F6469" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="28">しんじゅく</text>
  <rect x="64" y="502" width="632" height="1" fill="#CBC6BC"/>
  <circle cx="82" cy="565" r="12" fill="#356E80"/>
