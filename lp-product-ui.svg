  <text x="64" y="690" fill="#5F6469" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="22">現在地から</text>
  <text x="508" y="692" fill="#17191C" font-family="Arial, sans-serif" font-size="54" font-weight="700">84 m</text>
  <rect x="64" y="748" width="632" height="1" fill="#CBC6BC"/>
