  <text x="614" y="985" fill="#76552B" font-family="Arial, sans-serif" font-size="18" font-weight="700">SET</text>
  <text x="64" y="1094" fill="#8A8F93" font-family="Arial, sans-serif" font-size="15" letter-spacing="3">A QUIET INTERFACE FOR THE TRAIN</text>
