<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1180" role="img" aria-labelledby="title desc">
  <title id="title">エキココの現在駅画面</title>
  <desc id="desc">新宿駅、JR山手線、現在地から84メートルと表示された白基調の現在駅画面</desc>
  <rect width="760" height="1180" rx="64" fill="#17191C"/>
  <rect x="16" y="16" width="728" height="1148" rx="52" fill="#FBFAF6"/>
  <rect x="298" y="34" width="164" height="12" rx="6" fill="#CBC6BC"/>
  <text x="64" y="120" fill="#5F6469" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4">EKIKOKO</text>
  <circle cx="624" cy="111" r="8" fill="#2E6A52"/>
  <text x="646" y="118" fill="#5F6469" font-family="Arial, sans-serif" font-size="15" font-weight="700">GPS</text>
  <line x1="64" y1="154" x2="696" y2="154" stroke="#CBC6BC"/>
