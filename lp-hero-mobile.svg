<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1160" role="img" aria-labelledby="title desc">
<title id="title">エキココ スマホヒーロービジュアル</title>
<desc id="desc">スマホ画面を中心に、電車内、路線図、現在駅の情報を縦長に整理したエキココのモバイル用ヒーロー</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffefa"/><stop offset="1" stop-color="#eee8dd"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dce9ed"/><stop offset="1" stop-color="#f6f2eb"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#17191c" flood-opacity=".14"/></filter>
</defs>
<rect width="780" height="1160" rx="44" fill="url(#bg)"/>
<rect x="24" y="24" width="732" height="1112" rx="34" fill="none" stroke="#d2cec4"/>

<!-- train context -->
<rect x="54" y="110" width="672" height="404" rx="30" fill="#f8f6f0" stroke="#cfc7bb"/>
<rect x="94" y="154" width="592" height="272" rx="24" fill="url(#glass)" stroke="#d5cfc3"/>
<g opacity=".52">
  <rect x="118" y="286" width="58" height="104" rx="4" fill="#b8ced6"/><rect x="192" y="250" width="76" height="140" rx="4" fill="#abc3cc"/>
  <rect x="284" y="278" width="52" height="112" rx="4" fill="#c2d4da"/><rect x="350" y="226" width="92" height="164" rx="4" fill="#a9c0c9"/>
  <rect x="458" y="258" width="70" height="132" rx="4" fill="#bdd1d8"/><rect x="544" y="234" width="102" height="156" rx="4" fill="#acc4cd"/>
</g>
<g fill="none" stroke="#8c8b83" stroke-linecap="round">
  <path d="M190 110v54M390 110v54M590 110v54" stroke-width="7"/>
  <circle cx="190" cy="196" r="26" stroke-width="8"/><circle cx="390" cy="196" r="26" stroke-width="8"/><circle cx="590" cy="196" r="26" stroke-width="8"/>
</g>
<line x1="106" y1="398" x2="672" y2="398" stroke="#356e80" stroke-width="5" opacity=".28"/>
<line x1="132" y1="414" x2="646" y2="414" stroke="#76552b" stroke-width="3" opacity=".24"/>

<!-- top route card -->
<g transform="translate(94 454)">
  <rect width="592" height="162" rx="24" fill="#fffefa" stroke="#d3ccbf"/>
  <text x="28" y="42" fill="#8b9094" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.6">ROUTE / NOW</text>
  <polyline points="30,108 92,82 150,94 222,60 292,78 366,48 454,64 536,34" fill="none" stroke="#356e80" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#356e80"><circle cx="30" cy="108" r="8"/><circle cx="92" cy="82" r="8"/><circle cx="150" cy="94" r="9"/><circle cx="222" cy="60" r="8"/><circle cx="292" cy="78" r="8"/><circle cx="366" cy="48" r="8"/><circle cx="454" cy="64" r="8"/><circle cx="536" cy="34" r="8"/></g>
  <circle cx="150" cy="94" r="14" fill="none" stroke="#17191c" stroke-width="4"/>
  <rect x="190" y="106" width="130" height="32" rx="16" fill="#f0eee7" stroke="#d7d0c4"/>
  <text x="208" y="127" fill="#17191c" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.7">NOW / 新宿</text>
</g>

<!-- phone -->
<g filter="url(#shadow)" transform="translate(190 584)">
  <rect width="400" height="520" rx="52" fill="#17191c"/>
  <rect x="14" y="14" width="372" height="492" rx="41" fill="#fbfaf6"/>
  <rect x="158" y="28" width="84" height="10" rx="5" fill="#c9c5bb"/>
  <text x="42" y="84" fill="#8b9094" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">CURRENT STATION</text>
  <line x1="42" y1="102" x2="358" y2="102" stroke="#d1cbc0"/>
  <text x="40" y="226" fill="#17191c" font-family="Arial, 'Hiragino Sans', sans-serif" font-size="98" font-weight="700">新宿</text>
  <text x="44" y="260" fill="#62676b" font-family="Arial, 'Hiragino Sans', sans-serif" font-size="18">しんじゅく</text>
  <circle cx="52" cy="314" r="8" fill="#356e80"/><text x="74" y="321" fill="#17191c" font-family="Arial, 'Hiragino Sans', sans-serif" font-size="19">JR 山手線</text>
  <line x1="42" y1="352" x2="358" y2="352" stroke="#d1cbc0"/>
  <text x="44" y="396" fill="#62676b" font-family="Arial, 'Hiragino Sans', sans-serif" font-size="14">現在地から</text>
  <text x="260" y="400" fill="#17191c" font-family="Arial, sans-serif" font-size="36" font-weight="700">84 m</text>
  <rect x="42" y="430" width="316" height="54" rx="14" fill="#17191c"/>
  <text x="66" y="464" fill="#f4f1e8" font-family="Arial, 'Hiragino Sans', sans-serif" font-size="16" font-weight="700">車内モード</text>
  <text x="300" y="464" fill="#c8a16d" font-family="Arial, sans-serif" font-size="12" font-weight="700">OPEN</text>
</g>

<text x="72" y="78" fill="#76552b" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3">EKIKOKO / MOBILE</text>
</svg>