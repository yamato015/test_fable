<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
<title id="title">電車内でエキココを使うイメージ</title><desc id="desc">車窓、つり革、路線図とスマートフォンの現在駅表示を組み合わせたビジュアル</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#faf8f3"/><stop offset="1" stop-color="#e9e4da"/></linearGradient>
<linearGradient id="window" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dce9ee"/><stop offset="1" stop-color="#f8f5ef"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e9e5dc"/><stop offset=".5" stop-color="#fffefa"/><stop offset="1" stop-color="#ddd7cc"/></linearGradient>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#17191c" flood-opacity=".18"/></filter>
</defs>
<rect width="1400" height="980" fill="#f7f5ef"/>
<rect x="54" y="48" width="1292" height="884" rx="54" fill="url(#bg)" stroke="#cfc9bc" stroke-width="2"/>
<rect x="92" y="86" width="1216" height="810" rx="42" fill="#fffefa" stroke="#ddd7cc"/>
<!-- overhead rail and straps -->
<rect x="92" y="86" width="1216" height="86" rx="42" fill="url(#metal)"/>
<path d="M180 140H1210" stroke="#9a948b" stroke-width="8" stroke-linecap="round"/>
<g fill="none" stroke="#8d877e" stroke-width="7" stroke-linecap="round"><path d="M300 140v72"/><path d="M575 140v72"/><path d="M850 140v72"/><path d="M1125 140v72"/></g>
<g fill="#fffefa" stroke="#9b958c" stroke-width="6"><circle cx="300" cy="247" r="30"/><circle cx="575" cy="247" r="30"/><circle cx="850" cy="247" r="30"/><circle cx="1125" cy="247" r="30"/></g>
<!-- windows -->
<rect x="130" y="300" width="1140" height="430" rx="34" fill="url(#window)" stroke="#d2ccc1" stroke-width="2"/>
<g opacity=".72"><rect x="182" y="474" width="72" height="150" rx="4" fill="#bfd2d9"/><rect x="270" y="420" width="94" height="204" rx="4" fill="#afc6cf"/><rect x="382" y="458" width="66" height="166" rx="4" fill="#c7d6dc"/><rect x="466" y="392" width="120" height="232" rx="5" fill="#afc3cc"/><rect x="610" y="438" width="86" height="186" rx="4" fill="#bfd2d9"/><rect x="716" y="406" width="116" height="218" rx="5" fill="#a7bec8"/><rect x="852" y="454" width="78" height="170" rx="4" fill="#c3d4da"/><rect x="952" y="410" width="118" height="214" rx="5" fill="#adc3cc"/><rect x="1088" y="466" width="92" height="158" rx="4" fill="#c1d2d8"/></g>
<path d="M140 650H1260" stroke="#86aab7" stroke-width="5" opacity=".42"/><path d="M180 676H1190" stroke="#b18658" stroke-width="4" opacity=".36"/>
<!-- abstract route map panel -->
<g transform="translate(880 324)" filter="url(#shadow)"><rect width="330" height="250" rx="28" fill="#fffefa" stroke="#d0c9bd" stroke-width="2"/><text x="26" y="36" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2.4" fill="#7b8084">ROUTE / POSITION</text><polyline points="28,178 74,138 126,150 178,104 232,120 292,72" fill="none" stroke="#356e80" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><polyline points="44,70 98,112 126,150 178,184 242,176 300,204" fill="none" stroke="#76552b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><g fill="#356e80"><circle cx="28" cy="178" r="8"/><circle cx="74" cy="138" r="8"/><circle cx="178" cy="104" r="8"/><circle cx="232" cy="120" r="8"/><circle cx="292" cy="72" r="8"/></g><g fill="#76552b"><circle cx="44" cy="70" r="8"/><circle cx="98" cy="112" r="8"/><circle cx="178" cy="184" r="8"/><circle cx="242" cy="176" r="8"/><circle cx="300" cy="204" r="8"/></g><circle cx="126" cy="150" r="12" fill="#17191c"/><rect x="128" y="24" width="158" height="34" rx="17" fill="#f1eee7"/><text x="145" y="46" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.6" fill="#17191c">YOU ARE HERE</text></g>
<!-- phone -->
<g transform="translate(418 364) rotate(-8)" filter="url(#shadow)"><rect width="360" height="560" rx="54" fill="#15181a"/><rect x="12" y="12" width="336" height="536" rx="44" fill="#1b1f22"/><rect x="126" y="22" width="108" height="12" rx="6" fill="#30353a"/><text x="38" y="88" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2.4" fill="#a5aaae">CURRENT STATION</text><text x="38" y="220" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="98" font-weight="700" letter-spacing="-5" fill="#f2efe8">新宿</text><text x="42" y="260" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="20" fill="#a5aaae">しんじゅく</text><circle cx="50" cy="322" r="9" fill="#72a8b8"/><text x="72" y="330" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="19" fill="#f1efe9">JR 山手線</text><line x1="38" y1="370" x2="322" y2="370" stroke="#3b4146"/><text x="38" y="416" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="16" fill="#a5aaae">現在地から</text><text x="198" y="420" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#f2efe8">84 m</text><rect x="38" y="458" width="284" height="64" rx="16" fill="#f2efe8"/><text x="66" y="498" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="18" font-weight="700" fill="#17191c">車内モード</text><text x="262" y="498" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#76552b">OPEN</text></g>
<!-- lower station-sign strip -->
<g transform="translate(146 758)"><rect width="1108" height="104" rx="18" fill="#fffefa" stroke="#cfc8bc" stroke-width="2"/><rect width="1108" height="8" rx="4" fill="#356e80"/><text x="34" y="46" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2.6" fill="#8b9094">EKIKOKO / TRAIN INTERFACE</text><text x="34" y="82" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="26" font-weight="700" fill="#17191c">見えない車内でも、現在地を手元で。</text><circle cx="1008" cy="56" r="14" fill="#356e80"/><circle cx="1050" cy="56" r="14" fill="#76552b"/></g>
</svg>