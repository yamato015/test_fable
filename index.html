<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d1117">
  <meta name="description" content="電車内で現在いる駅・最寄り駅をすぐ確認できるアプリ">
  <title>いまここ！ - 現在駅チェッカー</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <!-- 開始画面 -->
    <section id="start-screen" class="screen">
      <h1 class="logo">いまここ！</h1>
      <p class="tagline">混雑した電車内でも、<br>いまどの駅にいるかすぐわかる。</p>
      <button id="start-btn" class="big-btn">現在地を確認する</button>
      <p class="note">位置情報の利用を許可してください。<br>位置情報は端末内でのみ使用され、保存されません。</p>
    </section>

    <!-- メイン画面 -->
    <section id="main-screen" class="screen hidden">
      <header class="status-bar">
        <span id="gps-status" class="badge">GPS取得中…</span>
        <button id="wakelock-btn" class="icon-btn" title="画面を常時点灯">💡</button>
      </header>

      <div class="station-display">
        <p id="status-label" class="status-label">最寄り駅</p>
        <h2 id="station-name" class="station-name">---</h2>
        <p id="station-kana" class="station-sub"></p>
        <p id="distance" class="distance"></p>
      </div>

      <div class="nearby">
        <h3>周辺の駅</h3>
        <ol id="nearby-list" class="nearby-list"></ol>
      </div>

      <footer class="footer">
        <p id="updated-at" class="updated"></p>
        <p class="credit">駅データ: © OpenStreetMap contributors</p>
      </footer>
    </section>

    <!-- エラー表示 -->
    <div id="error-banner" class="error-banner hidden"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
